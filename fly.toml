# fly.toml — AegisFlow (região São Paulo / gru = dados no Brasil)
# Se o nome "aegisflow" já estiver em uso no Fly, troque a linha `app` abaixo.
app = "aegisflow"
primary_region = "gru"

[build]

# Migrations rodam UMA vez, antes do deploy ir ao ar. Se falharem, o deploy aborta
# (melhor que subir quebrado). No runtime roda só o uvicorn (ver [processes]).
[deploy]
  release_command = "alembic upgrade head"

# Variáveis NÃO sensíveis. Segredos (DATABASE_URL, AEGIS_MASTER_KEY) vão via `fly secrets set`.
[env]
  AEGIS_ENV = "production"
  AEGIS_LOG_JSON = "true"
  AEGIS_CORS_ORIGINS = "https://aegisflow.tech,https://www.aegisflow.tech"
  # Betflow usa o Postgres/Supabase do gateway (schema isolado "betflow") em vez
  # do SQLite efemero, para track record persistir entre deploys/maquinas.
  BETFLOW_USE_GATEWAY_DB = "1"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  # Worker isolado (Betflow): coleta odds 24/7. NAO expoe HTTP, NAO toca no
  # gateway. So roda se voce escalar: `fly scale count collector=1 -a aegisflow`.
  collector = "python -m aegis_side.run_collector loop"

[http_service]
  internal_port = 8000
  force_https = true
  # Máquinas sempre quentes: sem janela de cold-start (crawler do AdSense/Google
  # marcava ads.txt como "não encontrado" ao cair em janelas de wake).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

# O coletor grava seus snapshots num SQLite proprio, num volume Fly dedicado
# (isolado do Postgres/Supabase do gateway). Monta em /data.
[[mounts]]
  source = "betflow_odds"
  destination = "/data"
  processes = ["collector"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
